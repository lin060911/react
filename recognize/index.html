<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/recognize.png">
    <title>辨别反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">辨别反应测试</h1>
    <p class="subtitle">Color &amp; Shape</p>
</header>

<div class="test-area">
    <div class="stage" id="gameContainer">
        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击屏幕或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 区域内随机出现 4 - 8 个不同颜色与形状的图形<br>
            2. 按上方提示，快速点击符合要求的那一个（如「红色 圆形」）<br>
            3. 共 15 组，点错只影响准确率，不影响正确时的用时统计<br>
            4. 最终统计准确率与正确时的平均点击用时
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">正确时平均用时</span>
                <span class="stat-value" id="currentAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">准确率</span>
                <span class="stat-value text-orange" id="currentAccuracy">-- %</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">完成组数</span>
                <span class="stat-value text-yellow" id="currentCount">0 / 15</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-2">
            <div class="stat-item">
                <span class="stat-label">最佳平均用时</span>
                <span class="stat-value best" id="bestAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最佳准确率</span>
                <span class="stat-value best" id="bestAccuracy">-- %</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/recognize.js"></script>
</body>
</html>
