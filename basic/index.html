<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/basic.png">
    <title>基础反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">基础反应测试</h1>
    <p class="subtitle">Basic Reaction</p>
</header>

<div class="test-area">
    <div class="stage">
        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="reaction-circle wait" id="circle"></div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击圆形或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 点击圆形开始，圆形变为灰蓝「等待」状态<br>
            2. 随机等待后突变为绿色，看到绿色立即点击<br>
            3. 绿色出现前点击记为「提前点击」，本次无效并重来<br>
            4. 默认 5 次为一组，结束后给出平均反应时间<br>
            5. 计时以绿色实际出现在屏幕上的那一帧为准；测试中切出页面本次作废
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">平均反应时间</span>
                <span class="stat-value" id="currentAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最快反应时间</span>
                <span class="stat-value text-orange" id="currentFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">有效次数</span>
                <span class="stat-value text-yellow" id="currentCount">0 / 5</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-2">
            <div class="stat-item">
                <span class="stat-label">最佳平均反应时间</span>
                <span class="stat-value best" id="bestAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">历史最快</span>
                <span class="stat-value best" id="bestFastest">-- ms</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/basic.js"></script>
</body>
</html>
