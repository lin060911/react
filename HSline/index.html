<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/hs.png">
    <title>头线定位测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">头线定位测试</h1>
    <p class="subtitle">Headshot Line</p>
</header>

<div class="test-area">
    <div class="stage stage-line" id="targetContainer">
        <div class="head-line"></div>
        <div class="target-ball hidden" id="targetBall"></div>

        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击屏幕或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 水平头线上会随机出现小球<br>
            2. 快速移动鼠标点击小球，模拟 FPS 头线定位<br>
            3. 从首次小球出现开始，直到反应超时结束<br>
            4. 超过 1000 ms 未点击判定为超时<br>
            5. 最终统计最快点击时间、平均点击时间与正确次数
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">最快点击时间</span>
                <span class="stat-value" id="currentFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均点击时间</span>
                <span class="stat-value text-orange" id="currentAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">正确次数</span>
                <span class="stat-value text-yellow" id="currentCorrect">0</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">最快点击时间</span>
                <span class="stat-value best" id="bestFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均点击时间</span>
                <span class="stat-value best" id="bestAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">正确次数</span>
                <span class="stat-value best" id="bestCorrect">0</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/HSline.js"></script>
</body>
</html>
