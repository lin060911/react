<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/arrow.png">
    <title>箭头反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        body { touch-action: manipulation; }
        .arrow-container {
            width:300px; height:300px;
            display:flex; align-items:center; justify-content:center;
            margin:10px 0; position:relative;
        }
        .arrow {
            width:220px; height:220px;
            border:10px solid #666;
            position:relative;
            display:flex; align-items:center; justify-content:center;
            font-size:84px; font-weight:900; color:#fff;
            box-shadow:0 0 30px rgba(0,0,0,0.7);
            border-radius:16px; opacity:0;
        }
        .arrow.visible {
            opacity:1;
            box-shadow:0 0 40px rgba(0,255,136,0.5), 0 0 20px rgba(255,255,255,0.4);
            border-color:#00ff88;
        }
        .arrow.up { border-width:10px 10px 0 10px; border-radius:50% 50% 0 0; }
        .arrow.down { border-width:0 10px 10px 10px; border-radius:0 0 50% 50%; }
        .arrow.left { border-width:10px 0 10px 10px; border-radius:50% 0 0 50%; }
        .arrow.right { border-width:10px 10px 10px 0; border-radius:0 50% 50% 0; }
        .timer-arrow {
            font-size:14px; color:#999; font-weight:600;
            text-align:center; min-height:20px; opacity:0;
            margin:8px 0;
        }
        .timer-arrow.visible { opacity:1; }
        @media (max-width:1024px) {
            .arrow-container { width:250px; height:250px; }
            .arrow { width:200px; height:200px; font-size:72px; border-width:8px; }
        }
        @media (max-width:600px) {
            .arrow-container { width:200px; height:200px; }
            .arrow { width:160px; height:160px; font-size:60px; }
        }
    </style>
</head>
<body>
    <div class="test-area">
        <h1 class="title">⬆️ 箭头反应测试</h1>

        <div class="flow-tip-container">
            <div class="flow-tip text-gray" id="flowTip">点击屏幕或按空格键开始测试</div>
        </div>

        <div class="timer-arrow" id="timer"></div>

        <div class="arrow-container">
            <div class="arrow" id="arrow"></div>
        </div>

        <div class="rule-tip" id="ruleTip">
            <strong>规则：</strong><br>
            1. 屏幕会随机出现上下左右箭头<br>
            2. 按对应方向键(↑↓←→)或WASD键(W=上/A=左/S=下/D=右)反应<br>
            3. 测试从首次箭头出现开始，直到按错方向或超时结束<br>
            4. 超过600ms未操作将判定为超时<br>
            5. 最终统计最快反应时间、平均反应时间和正确次数
        </div>
    </div>

    <div class="result-container">
        <div class="stats-group">
            <div class="stats-group-title">本次成绩</div>
            <div class="stats" id="currentStats">
                <div class="stat-item">
                    <div class="stat-label">最快反应时间</div>
                    <div class="stat-value text-green" id="currentFastest">-- ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">平均反应时间</div>
                    <div class="stat-value text-orange" id="currentAvg">-- ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">正确次数</div>
                    <div class="stat-value text-yellow" id="currentCorrect">0</div>
                </div>
            </div>
        </div>
        <div class="stats-group">
            <div class="stats-group-title">最佳成绩</div>
            <div class="stats" id="bestStats">
                <div class="stat-item">
                    <div class="stat-label">最快反应时间</div>
                    <div class="stat-value best" id="bestFastest">-- ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">平均反应时间</div>
                    <div class="stat-value best" id="bestAvg">-- ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">正确次数</div>
                    <div class="stat-value best" id="bestCorrect">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/arrow.js"></script>
</body>
</html>
