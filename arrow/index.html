<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/arrow.png">
    <title>箭头反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">箭头反应测试</h1>
    <p class="subtitle">Direction Reaction</p>
</header>

<div class="test-area">
    <div class="stage">
        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="arrow hidden" id="arrow"></div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击屏幕或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 屏幕会随机出现上、下、左、右箭头<br>
            2. 按对应方向键（<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>）或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 反应，手机可直接滑动<br>
            3. 从首次箭头出现开始，按错方向或超时即结束<br>
            4. 超过 600 ms 未操作判定为超时<br>
            5. 最终统计最快反应时间、平均反应时间与正确次数
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">最快反应时间</span>
                <span class="stat-value" id="currentFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均反应时间</span>
                <span class="stat-value text-orange" id="currentAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">正确次数</span>
                <span class="stat-value text-yellow" id="currentCorrect">0</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">最快反应时间</span>
                <span class="stat-value best" id="bestFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均反应时间</span>
                <span class="stat-value best" id="bestAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">正确次数</span>
                <span class="stat-value best" id="bestCorrect">0</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/arrow.js"></script>
</body>
</html>
