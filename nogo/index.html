<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/nogo.png">
    <title>Go / No-Go 抑制反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">抑制反应测试</h1>
    <p class="subtitle">Go / No-Go</p>
</header>

<div class="test-area">
    <div class="stage">
        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="stimulus-circle circle-wait" id="circle"></div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击圆形或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 点击圆形开始，共进行 10 次测试<br>
            2. 出现 <span class="text-green">绿色 GO</span> 时立即点击，越快越好<br>
            3. 出现 <span class="text-red">红色 NO-GO</span> 时切勿点击，忍住才算对<br>
            4. 结束后给出 Go 正确率、No-Go 正确率与平均反应时间<br>
            5. 信号出现前点击按失败处理；测试中切出页面本次作废
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">Go 正确率</span>
                <span class="stat-value" id="goRate">-- %</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">No-Go 正确率</span>
                <span class="stat-value text-orange" id="noGoRate">-- %</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">平均反应时间</span>
                <span class="stat-value text-yellow" id="avgRT">-- ms</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-2">
            <div class="stat-item">
                <span class="stat-label">最佳 No-Go 正确率</span>
                <span class="stat-value best" id="bestNoGoRate">-- %</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最佳平均反应时间</span>
                <span class="stat-value best" id="bestAvgRT">-- ms</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/nogo.js"></script>
</body>
</html>
