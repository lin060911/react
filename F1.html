<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 发车反应测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
            user-select: none;
            touch-action: manipulation;
        }

        .logo-container {
            margin-bottom: 0;
            text-align: center;
        }

        .logo {
            max-width: 300px;
            height: auto;
        }

        .title {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f5f5f5;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .light-container {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
        }

        .f1-light {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #333333;
            border: 3px solid #444444;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: none !important;
        }

        .f1-light.active {
            background: #ff3333;
            border-color: #ff6666;
            box-shadow: 0 0 20px #ff3333, 0 0 40px #ff3333;
            transition: none !important;
        }

        .f1-light.green {
            background: #00ff00;
            border-color: #66ff66;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            transition: none !important;
        }

        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0;
            min-height: 100px;
        }

        .result {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .timer {
            font-size: 18px;
            color: #999999;
            font-weight: 600;
            text-align: center;
            min-height: 25px;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .timer.visible {
            opacity: 1;
        }

        .tip {
            font-size: 16px;
            color: #999999;
            margin-bottom: 20px;
            text-align: left;
            max-width: 500px;
            line-height: 1.5;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .mode-switch-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            z-index: 10;
        }

        .mode-switch-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .switch-label {
            font-size: 16px;
            color: #999999;
            font-weight: 600;
            pointer-events: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 22px;
            pointer-events: none;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            border: 2px solid #444;
            transition: .4s;
            border-radius: 34px;
            pointer-events: none;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #00ff00;
            border-color: #66ff66;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        #soundModeToggle:checked + .slider {
            background-color: #ff9900;
            border-color: #ffcc00;
        }

        .best-record {
            font-size: 20px;
            color: #00ff88;
            margin-top: 20px;
            font-weight: 600;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
        }

        .text-yellow { color: #ffcc00; }
        .text-green { color: #00ff88; }
        .text-gray { color: #999999; }
        .text-red { color: #ff3333; }

        @media (max-width: 600px) {
            .f1-light {
                width: 40px;
                height: 40px;
            }
            .light-container {
                gap: 12px;
            }
            .logo {
                max-width: 140px;
            }
            .title {
                font-size: 22px;
            }
            .result {
                font-size: 34px;
            }
            .timer {
                font-size: 28px;
            }
            .mode-switch-group {
                padding: 8px 16px;
                gap: 10px;
            }
            .switch-label {
                font-size: 14px;
            }
            .switch {
                width: 45px;
                height: 22px;
            }
            .slider:before {
                height: 14px;
                width: 14px;
            }
            input:checked + .slider:before {
                transform: translateX(21px);
            }
            .controls-info {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="images/logo.png" alt="F1 Logo" class="logo">
    </div>

    <h1 class="title">F1 发车反应测试</h1>
    
    <div class="light-container">
        <div class="f1-light"></div>
        <div class="f1-light"></div>
        <div class="f1-light"></div>
        <div class="f1-light"></div>
        <div class="f1-light"></div>
    </div>

    <div class="result-container">
        <div class="result text-gray" id="result">点击屏幕开始</div>
        <div class="timer" id="timer"></div>
    </div>

    <div class="tip" id="tip">
        <strong>规则：</strong>来自真实F1发车信号灯规则<br>
        5盏红灯依次亮起 → 随机0.5s-3.0s红灯熄灭 → 熄灭瞬间点击<br>
        提前发车罚时 | 人类极限反应：≥100ms
    </div>

    <div class="mode-switch-group" id="modeSwitchGroup">
        <div class="mode-switch-item">
            <span class="switch-label">绿灯模式：</span>
            <label class="switch">
                <input type="checkbox" id="greenModeToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="mode-switch-item">
            <span class="switch-label">声音提示：</span>
            <label class="switch">
                <input type="checkbox" id="soundModeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="best-record" id="bestRecord">最快成绩：-- ms</div>

    <script>
        const lights = document.querySelectorAll('.f1-light');
        const result = document.getElementById('result');
        const timer = document.getElementById('timer');
        const bestRecord = document.getElementById('bestRecord');
        const tip = document.getElementById('tip');
        const greenModeToggle = document.getElementById('greenModeToggle');
        const soundModeToggle = document.getElementById('soundModeToggle');
        const modeSwitchGroup = document.getElementById('modeSwitchGroup');
        
        let testActive = false;
        let isCooldown = false;
        let startTime = 0;
        let bestTime = null;
        let lightTimer = null;
        let goTimer = null;
        let reactionTimer = null;
        const HUMAN_MIN_REACTION = 100;
        let isTouchEvent = false;
        const TOUCH_DELAY = 50;
        let isGreenMode = false;
        let isSoundMode = false;

        let audioContext;
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!isSoundMode) return;
            
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'light') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(220, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            }
            else if (type === 'go') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(990, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.8);
            }
        }

        modeSwitchGroup.addEventListener('click', function(e) {
            e.stopPropagation();
            const target = e.target;
            if (target.closest('.mode-switch-item:nth-child(1)')) {
                greenModeToggle.checked = !greenModeToggle.checked;
                toggleGreenMode(greenModeToggle.checked);
            } else if (target.closest('.mode-switch-item:nth-child(2)')) {
                soundModeToggle.checked = !soundModeToggle.checked;
                isSoundMode = soundModeToggle.checked;
            }
        });

        document.querySelectorAll('.switch-label, .switch, .slider').forEach(element => {
            element.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });

        greenModeToggle.addEventListener('change', function(e) {
            e.stopPropagation();
            toggleGreenMode(this.checked);
        });

        soundModeToggle.addEventListener('change', function(e) {
            e.stopPropagation();
            isSoundMode = this.checked;
        });

        function toggleGreenMode(enabled) {
            isGreenMode = enabled;
            if (isGreenMode) {
                tip.innerHTML = "<strong>规则：</strong>来自真实F1发车信号灯规则<br>5盏红灯依次亮起 → 随机0.5s-3.0s红灯变绿 → 变绿瞬间点击<br>提前发车罚时 | 人类极限反应：≥100ms";
            } else {
                tip.innerHTML = "<strong>规则：</strong>来自真实F1发车信号灯规则<br>5盏红灯依次亮起 → 随机0.5s-3.0s红灯熄灭 → 熄灭瞬间点击<br>提前发车罚时 | 人类极限反应：≥100ms";
            }
        }

        function fullReset() {
            testActive = false;
            startTime = 0;
            clearInterval(lightTimer);
            clearTimeout(goTimer);
            clearInterval(reactionTimer);
            lights.forEach(light => {
                light.classList.remove('active');
                light.classList.remove('green');
            });
            timer.classList.remove('visible');
            timer.textContent = '';
        }

        function updateBestRecord() {
            bestRecord.textContent = bestTime === null ? '最快成绩：-- ms' : `最快成绩：${bestTime} ms`;
        }

        function startCooldown() {
            isCooldown = true;
            setTimeout(() => {
                isCooldown = false;
                result.textContent = '点击屏幕或按[空格键]开始';
                result.className = 'result text-gray';
            }, 2000);
        }

        function updateReactionTimer() {
            if (startTime === 0) return;
            const currentTime = performance.now();
            const elapsed = Math.round(currentTime - startTime);
            timer.textContent = `${elapsed} ms`;
        }

        function startTest() {
            fullReset();
            testActive = true;
            result.textContent = isGreenMode ? '等待红灯变绿' : '等待所有红灯熄灭';
            result.className = 'result text-yellow';
            timer.classList.remove('visible');

            let lightIndex = 0;
            lightTimer = setInterval(() => {
                if (lightIndex < 5) {
                    lights[lightIndex].classList.add('active');
                    playSound('light');
                    lightIndex++;
                } else {
                    clearInterval(lightTimer);
                    const randomDelay = Math.random() * 2500 + 500;
                    goTimer = setTimeout(() => {
                        if (isGreenMode) {
                            for (let i = 0; i < lights.length; i++) {
                                lights[i].classList.remove('active');
                                lights[i].classList.add('green');
                            }
                        } else {
                            for (let i = 0; i < lights.length; i++) {
                                lights[i].classList.remove('active');
                            }
                        }
                        
                        playSound('go');
                        
                        startTime = performance.now();
                        
                        result.textContent = '发车！';
                        result.className = 'result text-green';
                        timer.classList.add('visible');
                        timer.textContent = '0 ms';
                        
                        clearInterval(reactionTimer);
                        reactionTimer = setInterval(updateReactionTimer, 10);
                    }, randomDelay);
                }
            }, 800);
        }

        function handleInteraction(e) {
            if (e.target.closest('.mode-switch-group')) {
                return;
            }
            
            e.preventDefault();
            
            if (isCooldown) return;

            isTouchEvent = e.type === 'touchstart';
            
            if (!testActive) {
                if (isTouchEvent) {
                    setTimeout(() => {
                        startTest();
                    }, TOUCH_DELAY);
                } else {
                    startTest();
                }
                return;
            }

            const handleJudge = () => {
                const currentTime = performance.now();
                const start = startTime;
                clearInterval(reactionTimer);
                timer.classList.remove('visible');
                timer.textContent = '';
                
                for (let i = 0; i < lights.length; i++) {
                    lights[i].classList.remove('active');
                    lights[i].classList.remove('green');
                }
                
                fullReset();

                if (start === 0) {
                    result.textContent = '提前发车将被罚时';
                    result.className = 'result text-red';
                    startCooldown();
                    return;
                }

                const reaction = Math.round(currentTime - start);
                if (reaction < HUMAN_MIN_REACTION) {
                    result.textContent = '❌ 无效成绩';
                    result.className = 'result text-red';
                } else {
                    if (bestTime === null || reaction < bestTime) {
                        bestTime = reaction;
                        updateBestRecord();
                    }
                    result.textContent = `${reaction} ms`;
                    result.className = 'result text-green';
                }

                startCooldown();
            };

            if (isTouchEvent) {
                setTimeout(handleJudge, TOUCH_DELAY);
            } else {
                handleJudge();
            }
        }

        function handleSpaceKey(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInteraction(e);
            }
        }

        document.addEventListener('click', handleInteraction);
        document.addEventListener('touchstart', handleInteraction, { passive: false });
        document.addEventListener('keydown', handleSpaceKey);
        
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        result.textContent = '点击屏幕或按[空格键]开始';
        updateBestRecord();
    </script>
</body>
</html>
