<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/f1.png">
    <title>F1 发车反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">F1 发车反应测试</h1>
    <p class="subtitle">Start Lights</p>
</header>

<div class="test-area">
    <div class="stage stage-f1">
        <div class="stage-top">
            <div class="result-big text-gray" id="result">点击屏幕或按空格键开始</div>
            <div class="timer" id="timer"></div>
        </div>

        <img src="../img/f1logo.png" alt="F1" class="logo">

        <div class="light-row" id="lightRow">
            <div class="f1-light"></div>
            <div class="f1-light"></div>
            <div class="f1-light"></div>
            <div class="f1-light"></div>
            <div class="f1-light"></div>
        </div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">5 盏红灯依次亮起，熄灭瞬间发车</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div class="mode-bar" id="modeBar" data-passive>
        <label class="mode-item">
            <span class="switch-label">绿灯模式</span>
            <span class="switch"><input type="checkbox" id="greenModeToggle"><span class="slider"></span></span>
        </label>
        <label class="mode-item">
            <span class="switch-label">声音提示</span>
            <span class="switch"><input type="checkbox" id="soundModeToggle"><span class="slider"></span></span>
        </label>
    </div>

    <div class="best-line" id="bestRecord">最快成绩：-- ms</div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong>5 盏红灯依次亮起 → 随机 0.5s - 3.0s 后发车信号出现 → 信号出现瞬间点击<br>
            熄灭模式：红灯全部熄灭即为发车；绿灯模式：红灯全部变绿即为发车<br>
            提前发车判罚 | 低于 100 ms 视为无效成绩 | 切出页面本次作废
        </div>
    </details>
</div>

<script src="../js/common.js"></script>
<script src="../js/F1.js"></script>
</body>
</html>
