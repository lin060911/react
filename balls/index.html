<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/balls.png">
    <title>定位反应测试</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="test-page">
<a class="back-link" href="../index.html">← 返回主页</a>

<header class="page-head">
    <h1 class="title">定位反应测试</h1>
    <p class="subtitle">Aim &amp; Click</p>
</header>

<div class="test-area">
    <div class="stage" id="gameContainer">
        <div class="stage-top">
            <div class="timer" id="timer"></div>
        </div>

        <div class="stage-bottom">
            <div class="flow-tip text-gray" id="flowTip">点击屏幕或按空格键开始测试</div>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <details class="rule-card" open>
        <summary>测试规则</summary>
        <div class="rule-body">
            <strong>规则：</strong><br>
            1. 区域内随机出现 3 - 5 个圆形符号，只有 1 个是 <strong>⨁</strong>（正确），其余为 <strong>⨂</strong><br>
            2. 快速找到并点击唯一的 ⨁<br>
            3. 共 15 组，点错则本组重来，不计入成绩<br>
            4. 最终以 15 组的平均点击用时作为成绩
        </div>
    </details>
</div>

<div class="result-container">
    <div class="stats-group">
        <div class="stats-group-title">本次成绩</div>
        <div class="stats cols-3">
            <div class="stat-item">
                <span class="stat-label">平均反应时间</span>
                <span class="stat-value" id="currentAvg">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最快一次</span>
                <span class="stat-value text-orange" id="currentFastest">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">完成组数</span>
                <span class="stat-value text-yellow" id="currentCount">0 / 15</span>
            </div>
        </div>
    </div>

    <div class="stats-group">
        <div class="stats-group-title">最佳成绩</div>
        <div class="stats cols-1">
            <div class="stat-item">
                <span class="stat-label">最佳平均反应时间</span>
                <span class="stat-value best" id="bestAvg">-- ms</span>
            </div>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/balls.js"></script>
</body>
</html>
